# Firebase Authentication.
# Verified 2026-09-30 against https://firebase.google.com/pricing and
# https://cloud.google.com/identity-platform/pricing.
#
# Phone authentication and multi-factor authentication are billed per SMS
# sent. The first 10 SMS per day are not billed (free_per_day). Prices
# below are USD per SMS. The country is not on the envelope (a phone
# number must not be recorded), so estimates use default_region us.
#
# Monthly active users are not observable per call. Identity Platform
# (Blaze, after upgrading Auth) prices Tier 1 MAU (email, phone,
# anonymous, social):
#   0-50,000            $0
#   50,001-100,000      $0.0055
#   100,001-1,000,000   $0.0046
#   1,000,001-10,000,000 $0.0032
#   10,000,001+         $0.0025
# Tier 2 (SAML/OIDC): 0-50 $0, then $0.015. Anonymous users are excluded
# from MAU when automatic clean-up is enabled. Spark plan phone auth is
# not available. Other Auth methods are no-cost on Spark and Blaze.
# sign_ins and anonymous_sign_ins are observations for that estimate.
# They are unpriced here because MAU is a monthly identity, not a call.
# Token refreshes, password resets, and admin lookups are unpriced.

provider = "firebase"
service = "auth"
currency = "USD"
source = "https://cloud.google.com/identity-platform/pricing"
checked_on = "2026-09-30"
default_region = "us"

