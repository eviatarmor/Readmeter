[package]
name = "readmeter-runtime"
description = "In-process client used by every SDK binding: normalize, evaluate local rules, buffer, encode."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["firebase", "window"]
firebase = ["dep:readmeter-provider-firebase", "readmeter-provider-firebase/firestore"]
database = ["dep:readmeter-provider-firebase", "readmeter-provider-firebase/database"]
window = ["readmeter-rules/window", "readmeter-provider-firebase?/window"]

[dependencies]
readmeter-core.workspace = true
readmeter-rules.workspace = true
readmeter-provider-api.workspace = true
readmeter-provider-firebase = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
readmeter-rules = { workspace = true, features = ["catalog-toml"] }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
