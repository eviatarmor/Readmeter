# Regenerate with: cbindgen --config cbindgen.toml --crate readmeter-ffi --output include/readmeter.h
language = "C"
header = "/* Readmeter C ABI. Generated by cbindgen from crates/bindings/ffi; do not edit. */"
include_guard = "READMETER_H"
cpp_compat = true
documentation = true
documentation_style = "c99"
style = "type"
usize_is_size_t = true

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[export]
include = ["RmStatus", "RmBuf"]
