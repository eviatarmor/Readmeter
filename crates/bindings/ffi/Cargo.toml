[package]
name = "readmeter-ffi"
description = "C ABI over readmeter-runtime for C++, Swift, Kotlin/JNI, Dart, .NET and Python."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["firebase", "window"]
firebase = ["readmeter-runtime/firebase"]
database = ["readmeter-runtime/database"]
storage = ["readmeter-runtime/storage"]
auth = ["readmeter-runtime/auth"]
window = ["readmeter-runtime/window"]

[dependencies]
readmeter-runtime = { workspace = true, default-features = false }

[dev-dependencies]
readmeter-rules.workspace = true
serde_json.workspace = true

[lints]
workspace = true
