<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Readmeter Firestore examples</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0 auto; max-width: 52rem; padding: 1.25rem; }
      h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
      h2 { font-size: 1.05rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 1rem; line-height: 1.4; }
      .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
      button, input { font: inherit; }
      button { padding: 0.45rem 0.7rem; }
      label { display: block; margin: 0.4rem 0; }
      input { width: min(100%, 24rem); padding: 0.4rem; }
      #log {
        min-height: 12rem;
        max-height: 24rem;
        overflow: auto;
        white-space: pre-wrap;
        padding: 0.75rem;
        border: 1px solid #888;
        font-family: ui-monospace, monospace;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <h1>Readmeter Firebase examples</h1>
    <p>Each button does one wasteful Firestore, Realtime Database, Cloud Storage, Authentication, or Cloud Functions pattern against the emulators. Local findings show up in the log.</p>
    <h2>Cloud Firestore</h2>
    <div class="actions" id="actions"></div>
    <h2>Realtime Database</h2>
    <div class="actions" id="database"></div>
    <h2>Cloud Storage</h2>
    <div class="actions" id="storage"></div>
    <h2>Authentication</h2>
    <div class="actions" id="auth"></div>
    <h2>Cloud Functions</h2>
    <div class="actions" id="functions"></div>
    <div id="recaptcha" style="position: absolute; width: 0; height: 0; overflow: hidden"></div>
    <label>Search <input id="search" type="text" autocomplete="off" placeholder="queries on every keystroke" /></label>
    <label>Draft <input id="draft" type="text" autocomplete="off" placeholder="saves on every keystroke" /></label>
    <pre id="log" aria-live="polite"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
