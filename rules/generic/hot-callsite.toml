id = "generic/hot-callsite"
title = "Callsite dominates spend"
provider = "*"
service = "*"
severity = "info"
category = "reads"
evaluation = "aggregate"
status = "stable"
summary = "A single callsite accounts for a large share of the project's billed units."

description = """
Cost is usually concentrated in a few places in the code. Over the window
this rule sums every billed unit on the project and reports a callsite
whose share of one unit crosses the threshold, once that unit's project
total is large enough to matter. The finding names the unit with the
largest share.
"""

fix = "Review the callsite for caching, pagination and subscription scope."

[params]
window_ms = 3600000
min_share = 0.3
min_reads = 10000

[[examples]]
lang = "ts"
bad = '''
export async function loadHome() {
  return getDocs(query(collection(db, "posts"), orderBy("at", "desc")));
}
'''
good = '''
const home = new Map<string, QuerySnapshot>();
export async function loadHome() {
  const hit = home.get("posts");
  if (hit) return hit;
  const snap = await getDocs(query(collection(db, "posts"), orderBy("at", "desc"), limit(20)));
  home.set("posts", snap);
  return snap;
}
'''
