id = "firebase.firestore/listener-reconnect-rebill"
title = "Listeners re-billed after long disconnects"
provider = "firebase"
service = "firestore"
severity = "medium"
category = "realtime"
evaluation = "aggregate"
status = "planned"
default_enabled = false
summary = "Clients reconnect after 30+ minutes offline and re-read full listener results."

description = """
When a listener has been disconnected for more than 30 minutes, Firestore
bills it as a new query on reconnect. Mobile apps that background often and
keep large listeners pay the full result repeatedly.

There is still no reconnect signal on the envelope. An unsubscribe followed
by a subscribe is ordinary navigation, already reported per session by
`generic/subscription-churn`. A new session that subscribes after a
page-visible event is an ordinary cold start. Neither one says the client
was offline long enough for Firestore to rebill the listener, so this rule
stays planned until shims report that reconnect.
"""

fix = """
Detach listeners when the app backgrounds and re-attach with a narrower
query, or listen to a summary document.
"""

docs = ["https://firebase.google.com/docs/firestore/pricing#listens"]
