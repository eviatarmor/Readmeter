id = "firebase.firestore/read-in-render"
title = "Read issued during render"
provider = "firebase"
service = "firestore"
severity = "high"
category = "reads"
evaluation = "window"
status = "beta"
summary = "A read runs in the component body, so every render bills it again."

description = """
A `getDoc`, `getDocs`, or `getCountFromServer` call in the render path
runs again on every render, and each call is billed. React state updates
and parent renders multiply that cost. The rule fires when one callsite
issues several billed reads during render within a short window; reads
after the first count as waste.

The web SDK marks a read as in render when the call stack contains React's
render entry point (`renderWithHooks`, or `renderWithHooksAgain` in React
19). Effects and event handlers run from other frames and are not marked.
This only works with development builds of React: production builds
minify function names, so reads there are never marked and the rule stays
silent. When reads carry a component mount id (`withReadmeterMount` from
`@readmeter/react`), repeats are counted per component instance, so a list
of items that each read once does not fire.
"""

fix = """
Move the read into `useEffect` (or a cache such as TanStack Query) so it
runs when its inputs change, not on every render.
"""

[params]
min_reads = 3
window_ms = 10000

[[examples]]
lang = "ts"
bad = '''
function Badge(db: Firestore) {
  const [n, setN] = useState(0);
  getCountFromServer(query(collection(db, "messages"), where("read", "==", false))).then((snap) => {
    setN(snap.data().count);
  });
  return n;
}
'''
good = '''
function Badge(db: Firestore) {
  const [n, setN] = useState(0);
  useEffect(() => {
    getCountFromServer(query(collection(db, "messages"), where("read", "==", false))).then((snap) => {
      setN(snap.data().count);
    });
  }, [db]);
  return n;
}
'''
