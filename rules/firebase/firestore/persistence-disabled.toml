id = "firebase.firestore/persistence-disabled"
title = "Offline persistence disabled"
provider = "firebase"
service = "firestore"
severity = "low"
category = "reads"
evaluation = "local"
status = "stable"
summary = "The client SDK runs without a persistent cache, so every reload re-reads from the server."

description = """
A memory-only cache is discarded when the page unloads. The next load
reads every document and every listener result from the server again,
and Firestore bills each of those reads. A persistent cache can serve
unchanged documents locally.
"""

fix = """
Initialize Firestore with `persistentLocalCache()` (web) or keep the
default persistence on mobile.
"""

docs = ["https://firebase.google.com/docs/firestore/manage-data/enable-offline"]

[[examples]]
lang = "ts"
bad = '''
const db = initializeFirestore(app, { localCache: memoryLocalCache() });
'''
good = '''
const db = initializeFirestore(app, { localCache: persistentLocalCache() });
'''
