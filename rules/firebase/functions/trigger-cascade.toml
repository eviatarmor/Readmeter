id = "firebase.functions/trigger-cascade"
title = "Function writes the collection that triggered it"
provider = "firebase"
service = "functions"
severity = "high"
category = "writes"
evaluation = "local"
status = "beta"
summary = "A Firestore-triggered function writes documents that match its own trigger."

description = """
`onDocumentWritten("posts/{id}")` runs again for every document it
writes that matches `posts/{id}`. That loop bills a new invocation and
the writes each time, and it can run away. When `withFlush` wraps a
Firestore-triggered handler, the SDK reads the event's document path
and params in memory, turns the path into a pattern (each segment that
holds a param value becomes a wildcard), and counts the Firestore
writes made during that invocation whose document path matches it.
Batch and transaction commits count each matching write. Only the
count is recorded. The pattern, the event's document path, and the
written paths never leave the process. Each counted write is one extra
invocation.
"""

fix = """
Write to a different collection, or guard the handler so a write made
by the function itself does not match the trigger again, for example
by returning early when the fields it sets are already set.
"""

docs = ["https://firebase.google.com/docs/functions/firestore-events"]

[params]
min_writes = 1

[[examples]]
lang = "ts"
bad = '''
export const cascade = onDocumentWritten("posts/{id}", withFlush(async (event) => {
  await event.data?.after.ref.set({ touched: true }, { merge: true });
}));
'''
good = '''
export const cascade = onDocumentWritten("posts/{id}", withFlush(async (event) => {
  const id = event.params.id;
  await db.collection("postSummaries").doc(id).set({ touched: true });
}));
'''
