id = "firebase.database/unindexed-query"
title = "Query without an index"
provider = "firebase"
service = "database"
severity = "high"
category = "reads"
evaluation = "local"
status = "beta"
summary = "orderByChild on a path with no .indexOn makes the server send the whole location for the client to filter."

description = """
When a listener (`onValue`, `onChildAdded`, ...) orders by a child that is
not declared with `.indexOn`, the server cannot run the query. It sends the
whole location and the client applies the order and limit, so a
`limitToLast(25)` still downloads every child. The Realtime Database web SDK
reports this in the listen response and logs "Using an unspecified index"
through `console.warn`, later and unattached to the query.

The web drop-in (`@readmeter/firebase/database`) passes `console.warn`
through unchanged and records that warning with the path and child it names.
The callsite comes from the most recent listener on the same path and child.
Only the web SDK is covered. Nothing is reported when the host silences the
Firebase logger (`setLogLevel("silent")` or `"error"`) or replaces
`console.warn` without calling the previous one.
"""

fix = """
Add `.indexOn` for the ordered child in Realtime Database rules, and keep
`limitToFirst` or `limitToLast` on the query.
"""

docs = ["https://firebase.google.com/docs/database/security/indexing-data"]

[[examples]]
lang = "ts"
bad = '''
// rules: { "rules": { "posts": { ".read": true } } }
query(ref(db, "posts"), orderByChild("created"), limitToLast(25));
'''
good = '''
// rules: { "rules": { "posts": { ".indexOn": "created", ".read": true } } }
query(ref(db, "posts"), orderByChild("created"), limitToLast(25));
'''
