[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "readmeter"
dynamic = ["version"]
description = "Find Firebase cost problems from Python. Wraps the Readmeter Rust core through its C ABI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/eviatarmor/Readmeter"

[tool.setuptools.dynamic]
version = { attr = "readmeter._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Copy the shared library and bundle.bin into src/readmeter/ before building
# a wheel to ship them with the package (see README).
readmeter = ["*.dll", "*.so", "*.dylib", "bundle.bin", "py.typed"]
